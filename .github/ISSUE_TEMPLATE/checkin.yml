name: 每日 Agent 学习打卡
description: 记录今天学了什么，自动更新日、周、月视图
title: "[打卡] "
body:
  - type: dropdown
    id: date
    attributes:
      label: 学习日期
      description: 选择提交当天或具体日期；日期列表在每次打卡汇总时刷新。更早日期可在提交后编辑 Issue 的学习日期。
      default: 0
      options:
        - 提交当天（北京时间）
        - "2026-10-11"
        - "2026-10-10"
        - "2026-10-09"
        - "2026-10-08"
        - "2026-10-07"
        - "2026-10-06"
        - "2026-10-05"
        - "2026-10-04"
        - "2026-10-03"
        - "2026-10-02"
        - "2026-10-01"
        - "2026-09-30"
        - "2026-09-29"
        - "2026-09-28"
        - "2026-09-27"
        - "2026-09-26"
        - "2026-09-25"
        - "2026-09-24"
        - "2026-09-23"
        - "2026-09-22"
        - "2026-09-21"
        - "2026-09-20"
        - "2026-09-19"
        - "2026-09-18"
        - "2026-09-17"
        - "2026-09-16"
        - "2026-09-15"
        - "2026-09-14"
        - "2026-09-13"
        - "2026-09-12"
        - "2026-09-11"
  - type: input
    id: topic
    attributes:
      label: 学习主题
      placeholder: 例如：工具调用与 MCP
    validations:
      required: true
  - type: input
    id: minutes
    attributes:
      label: 学习时长（分钟）
      placeholder: "60"
    validations:
      required: true
  - type: textarea
    id: learned
    attributes:
      label: 今天学了什么
      placeholder: 核心概念、理解、代码或教程链接
    validations:
      required: true
  - type: textarea
    id: practice
    attributes:
      label: 实践与产出
      placeholder: 做了什么？附项目链接或截图。
  - type: textarea
    id: questions
    attributes:
      label: 问题与收获
  - type: textarea
    id: next
    attributes:
      label: 下一步
