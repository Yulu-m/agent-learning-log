name: 每日 Agent 学习打卡
description: 记录今天学了什么，自动更新日、周、月视图
title: "[打卡] "
body:
  - type: dropdown
    id: date
    attributes:
      label: 学习日期
      description: 选择提交当天或具体日期；日期列表在每次打卡汇总时刷新。更早日期可在提交后编辑 Issue 的学习日期。
      default: 0
      options:
        - 提交当天（北京时间）
        - "2026-10-24"
        - "2026-10-23"
        - "2026-10-22"
        - "2026-10-21"
        - "2026-10-20"
        - "2026-10-19"
        - "2026-10-18"
        - "2026-10-17"
        - "2026-10-16"
        - "2026-10-15"
        - "2026-10-14"
        - "2026-10-13"
        - "2026-10-12"
        - "2026-10-11"
        - "2026-10-10"
        - "2026-10-09"
        - "2026-10-08"
        - "2026-10-07"
        - "2026-10-06"
        - "2026-10-05"
        - "2026-10-04"
        - "2026-10-03"
        - "2026-10-02"
        - "2026-10-01"
        - "2026-09-30"
        - "2026-09-29"
        - "2026-09-28"
        - "2026-09-27"
        - "2026-09-26"
        - "2026-09-25"
        - "2026-09-24"
  - type: input
    id: topic
    attributes:
      label: 学习主题
      placeholder: 例如：工具调用与 MCP
    validations:
      required: false
  - type: input
    id: minutes
    attributes:
      label: 学习时长（分钟）
      placeholder: "60"
    validations:
      required: false
  - type: textarea
    id: learned
    attributes:
      label: 今天学了什么
      placeholder: 核心概念、理解、代码或教程链接
    validations:
      required: true
  - type: textarea
    id: practice
    attributes:
      label: 今天完成了什么
      placeholder: 做了什么？附项目链接或截图。
  - type: textarea
    id: questions
    attributes:
      label: 问题与收获
  - type: textarea
    id: next
    attributes:
      label: 下一步
      placeholder: 明天可以直接开始的一件小事
  - type: dropdown
    id: category
    attributes:
      label: 学习方向
      default: 0
      options:
        - 其他
        - Agent 基础
        - 工具调用与 MCP
        - RAG 与知识库
        - 工作流与多智能体
        - 评估与可靠性
        - 项目实践
  - type: dropdown
    id: mastery
    attributes:
      label: 掌握程度
      description: 个人自评，用于观察自己的变化
      default: 0
      options:
        - 未评估
        - 1 · 初步了解
        - 2 · 能跟着做
        - 3 · 能独立实践
        - 4 · 能解释并迁移
  - type: dropdown
    id: record_type
    attributes:
      label: 记录类型
      default: 0
      options:
        - 正式学习记录
        - 测试记录（不计入统计和正式邮件）
  - type: textarea
    id: moments
    attributes:
      label: 今日拾光
      description: 选填，留下一点学习之外的生活。
      placeholder: 今天的趣事、心情、偶遇，或任何想记住的小事。
