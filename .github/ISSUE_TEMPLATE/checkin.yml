name: 每日 Agent 学习打卡
description: 记录今天学了什么，自动更新日、周、月视图
title: "[打卡] "
body:
  - type: input
    id: date
    attributes:
      label: 学习日期
      description: YYYY-MM-DD；留空使用提交当天的北京时间，可补打卡。
  - type: input
    id: topic
    attributes:
      label: 学习主题
      placeholder: 例如：工具调用与 MCP
    validations:
      required: true
  - type: input
    id: minutes
    attributes:
      label: 学习时长（分钟）
      placeholder: "60"
    validations:
      required: true
  - type: textarea
    id: learned
    attributes:
      label: 今天学了什么
      placeholder: 核心概念、理解、代码或教程链接
    validations:
      required: true
  - type: textarea
    id: practice
    attributes:
      label: 实践与产出
      placeholder: 做了什么？附项目链接或截图。
  - type: textarea
    id: questions
    attributes:
      label: 问题与收获
  - type: textarea
    id: next
    attributes:
      label: 下一步
