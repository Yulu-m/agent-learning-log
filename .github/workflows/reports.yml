name: 学习日报周报月报邮件
on:
  schedule:
    # UTC 02:00 = 北京时间 10:00
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: 发送哪种报告（auto 按当天判断）
        type: choice
        default: auto
        options: [auto, daily, weekly, monthly, test]
      preview:
        description: 仅生成预览，不发送
        type: boolean
        default: true
  push:
    paths: ['scripts/**', 'tests/**', '.github/workflows/reports.yml']
permissions:
  contents: write
  issues: read
concurrency:
  group: learning-views
  cancel-in-progress: false
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py --sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 生成或发送报告
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_KIND: ${{ inputs.kind || 'auto' }}
          PREVIEW_ONLY: ${{ github.event_name == 'push' || inputs.preview == true }}
        run: |
          if [ "$PREVIEW_ONLY" = "true" ]; then
            python scripts/mail.py --kind "$REPORT_KIND" --preview
          else
            python scripts/mail.py --kind "$REPORT_KIND"
          fi
      - name: 保存报告预览
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mail-preview
          path: mail-preview/
          retention-days: 7
      - name: 保存学习视图
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md records views .github/ISSUE_TEMPLATE/checkin.yml
          if ! git diff --cached --quiet; then
            git commit -m "更新学习看板与复盘"
          fi
          git pull --rebase origin main
          git push origin HEAD:main
