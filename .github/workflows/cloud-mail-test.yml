name: 云端邮件迁移验收
on:
  push:
    paths: ['.github/workflows/cloud-mail-test.yml']
permissions:
  contents: write
  issues: read
concurrency:
  group: learning-views
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build.py --sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 验证三个邮件 Secrets 已配置
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          test -n "$SMTP_USERNAME" && test -n "$SMTP_PASSWORD" && test -n "$MAIL_TO"
      - name: Gmail SMTP 实际测试发送
        run: python scripts/mail.py --kind test
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ github.token }}
